spring.application.name=agentic-url-shortener
server.port=43127
spring.thymeleaf.cache=false
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:h2:file:./data/agentic-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# API key must be supplied via environment (never commit secrets).
# Example: export AGENTIC_API_KEY=your-local-secret
agentic.api-key=${AGENTIC_API_KEY:}
agentic.rate-limit.requests-per-minute=${AGENTIC_RATE_LIMIT:60}
# Local control-plane convenience: fill the UI from the same runtime key (not committed).
agentic.ui.bootstrap-api-key=true
