spring.application.name=agentic-url-shortener
server.port=43127
spring.thymeleaf.cache=false
# Local/demo: always serve fresh static CSS/JS after UI updates
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

spring.datasource.url=jdbc:h2:file:./data/agentic-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

agentic.api-key=demo-api-key-change-me
agentic.rate-limit.requests-per-minute=60
